name: Release

# 手动运行（Actions → Release → Run workflow，或 `gh workflow run release.yml --ref dev`）。
# 版本取自所选分支的 package.json；tag 在全部产物上传、Release 公开的那一刻才由 GitHub 创建，
# 所以构建期间和构建失败时都不会出现指向不存在 Release 的 tag（客户端检查更新会 404）。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Never replace an already published version: clients may have cached its metadata.
      - name: Resolve version and refuse an existing tag or release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} already exists. Bump package.json before releasing."
            exit 1
          fi
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${TAG}\") | .id")
          if [ -n "$EXISTING" ]; then
            echo "::error::A release or draft for ${TAG} already exists (id ${EXISTING}). Review it before releasing again."
            exit 1
          fi
          # v0.* 与带预发布后缀（如 1.0.0-beta.1）的版本标为 Pre-release，正式版用户不会收到。
          if [[ "$TAG" == v0.* || "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (prerelease=${PRERELEASE}) from ${GITHUB_SHA}"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      # 五项凭证全空：退回未签名 DMG，不发布 macOS 更新元数据；只配了一部分：直接失败。
      - name: Detect macOS release credentials
        id: mac_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$APPLE_TEAM_ID" ]; then
            echo "::warning::No macOS signing credentials; publishing an unsigned DMG without in-app updates."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/checkMacRelease.cjs
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup .NET for Windows taskbar host
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      # The macOS hooks reject missing signing/notarization and validate the stapled app.
      - name: Build, sign and notarize macOS
        if: runner.os == 'macOS' && steps.mac_signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run electron:build:mac

      - name: Build unsigned macOS DMG
        if: runner.os == 'macOS' && steps.mac_signing.outputs.signed != 'true'
        run: |
          npm run electron:build:mac:unsigned
          # 未签名包不能应用内更新，不能让它的元数据进入 Release。
          rm -f release/latest-mac.yml release/*.zip release/*.zip.blockmap

      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build:win -- --publish never

      - name: Verify release artifacts and update metadata
        if: runner.os == 'Windows' || steps.mac_signing.outputs.signed == 'true'
        run: npm run release:verify -- ${{ matrix.artifact }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/latest-mac.yml

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release/

      - name: List release files
        run: ls -la release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # The build took minutes; refuse if the tag appeared meanwhile.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::Tag ${TAG} was created while this release was building."
            exit 1
          fi
          # Keep the release a draft until all installers and metadata have uploaded.
          shopt -s nullglob
          FILES=(release/*.dmg release/*.zip release/*.exe)
          test -f release/latest.yml
          FILES+=(release/latest.yml)
          # 增量更新需要新旧两个版本的 blockmap 都在各自的 Release 里。
          BLOCKMAPS=(release/*.exe.blockmap)
          test "${#BLOCKMAPS[@]}" -gt 0
          FILES+=("${BLOCKMAPS[@]}")
          # 未签名的 macOS 构建不带更新元数据；签名构建的增量更新需要 ZIP 的 blockmap。
          if [ -f release/latest-mac.yml ]; then
            ZIP_BLOCKMAPS=(release/*.zip.blockmap)
            test "${#ZIP_BLOCKMAPS[@]}" -gt 0
            FILES+=(release/latest-mac.yml "${ZIP_BLOCKMAPS[@]}")
          fi
          echo "Uploading: ${FILES[*]}"
          if [ "$PRERELEASE" = true ]; then PRE="--prerelease"; else PRE=""; fi
          # A draft does not create its tag; publishing it tags the built commit.
          gh release create "$TAG" "${FILES[@]}" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $PRE
          # Drafts have no tag yet, so look the draft up by id rather than by tag name.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id")
          test -n "$RELEASE_ID"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false > /dev/null
          echo "Published ${TAG} at ${GITHUB_SHA}" 
