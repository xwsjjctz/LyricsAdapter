name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Validate release version
        shell: bash
        run: |
          node -e 'const version = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Release tag must match package.json version")'

      # 五项凭证全空：退回未签名 DMG，不发布 macOS 更新元数据；只配了一部分：直接失败。
      - name: Detect macOS release credentials
        id: mac_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$APPLE_TEAM_ID" ]; then
            echo "::warning::No macOS signing credentials; publishing an unsigned DMG without in-app updates."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/checkMacRelease.cjs
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup .NET for Windows taskbar host
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      # The macOS hooks reject missing signing/notarization and validate the stapled app.
      - name: Build, sign and notarize macOS
        if: runner.os == 'macOS' && steps.mac_signing.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run electron:build:mac

      - name: Build unsigned macOS DMG
        if: runner.os == 'macOS' && steps.mac_signing.outputs.signed != 'true'
        run: |
          npm run electron:build:mac:unsigned
          # 未签名包不能应用内更新，不能让它的元数据进入 Release。
          rm -f release/latest-mac.yml release/*.zip release/*.zip.blockmap

      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run electron:build:win -- --publish never

      - name: Verify release artifacts and update metadata
        if: runner.os == 'Windows' || steps.mac_signing.outputs.signed == 'true'
        run: npm run release:verify -- ${{ matrix.artifact }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/latest-mac.yml

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release/

      - name: List release files
        run: ls -la release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Never replace an already published version: clients may have cached its metadata.
          # Keep the release a draft until all installers and metadata have uploaded.
          shopt -s nullglob
          FILES=(release/*.dmg release/*.zip release/*.exe)
          test -f release/latest.yml
          FILES+=(release/latest.yml)
          # 增量更新需要新旧两个版本的 blockmap 都在各自的 Release 里。
          BLOCKMAPS=(release/*.exe.blockmap)
          test "${#BLOCKMAPS[@]}" -gt 0
          FILES+=("${BLOCKMAPS[@]}")
          # 未签名的 macOS 构建不带更新元数据；签名构建的增量更新需要 ZIP 的 blockmap。
          if [ -f release/latest-mac.yml ]; then
            ZIP_BLOCKMAPS=(release/*.zip.blockmap)
            test "${#ZIP_BLOCKMAPS[@]}" -gt 0
            FILES+=(release/latest-mac.yml "${ZIP_BLOCKMAPS[@]}")
          fi
          echo "Uploading: ${FILES[*]}"
          # 创建新的 release（v0.* 自动标记为 Pre-release）
          if [[ "$TAG" == v0.* ]]; then PRE="--prerelease"; else PRE=""; fi
          gh release create "$TAG" "${FILES[@]}" \
            --draft --verify-tag \
            --title "$TAG" \
            --generate-notes \
            $PRE
          gh release edit "$TAG" --draft=false
