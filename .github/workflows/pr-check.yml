name: PR Check

on:
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality checks
        run: npm run check

      - name: Install Chromium-family runtime libraries
        run: npx playwright install-deps chromium

      - name: Electron smoke test
        run: xvfb-run -a npm run test:e2e:run

  native-build:
    name: Windows native build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build C# taskbar host
        run: npm run native:build:taskbar-host -- --force

      - name: Smoke test C# taskbar host
        run: npm run native:test:taskbar-host

      - name: Verify composed taskbar lyrics pixels
        run: npm run test:e2e -- windows-taskbar-lyrics.visual.spec.ts

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  native-build-macos:
    name: macOS native build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild status bar bridge from source
        run: npm run native:rebuild:macos-statusbar -- --force

      - name: Type check
        run: npm run typecheck

      - name: Native bridge tests
        run: npx vitest run test/electron/native/macosStatusbarNative.test.ts test/electron/services/menuBarLyricsService.test.ts
