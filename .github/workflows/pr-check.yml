name: PR Check

on:
  pull_request:
    branches:
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality checks
        run: npm run check

      - name: Install Chromium-family runtime libraries
        run: npx playwright install-deps chromium

      - name: Electron smoke test
        run: xvfb-run -a npm run test:e2e:run

  windows-helper:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows taskbar lyrics helper
        run: dotnet build native/windows-taskbar-lyrics/LyricsAdapter.TaskbarLyrics.csproj -c Release
